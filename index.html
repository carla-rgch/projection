<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Télécommande</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
  html,body{margin:0;background:#020b12;height:100%}
  #wrap{position:relative;width:100%;max-width:480px;margin:0 auto}
  #wrap img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
  .zone{position:absolute;border-radius:999px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .35s}
  .zone.flash{background:rgba(120,230,255,.28);transition:background .05s}
  #err{position:fixed;left:8px;right:8px;top:8px;background:#7a1f1f;color:#fff;font:14px system-ui;padding:8px 12px;border-radius:8px;display:none}
</style></head><body>
<div id="wrap">
  <img src="accueil.png" alt="Accueil">
  <div class="zone" data-cmd="play" style="left:6.15%;top:87.2%;width:87.7%;height:6.6%"></div>
</div>
<div id="err"></div>
<script src="config.js"></script>
<script>
const RELAY = new URLSearchParams(location.search).get('relay') || 'https://ntfy.sh';
const err = document.getElementById('err');
function send(cmd) {
  return fetch(RELAY + '/' + window.TOPIC, { method: 'POST', body: cmd })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); err.style.display = 'none'; })
    .catch(e => { err.textContent = "Message non envoyé (" + e.message + "). Vérifiez la connexion internet."; err.style.display = 'block'; });
}
document.querySelectorAll('.zone').forEach(z => z.addEventListener('click', () => {
  send(z.dataset.cmd);
  z.classList.add('flash'); setTimeout(() => z.classList.remove('flash'), 150);
}));
</script></body></html>
