<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Projection</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #frame{position:absolute;left:50%;top:50%;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));
         transform:translate(-50%,-50%);background:#031624;overflow:hidden}
  /* fond de secours (visible seulement si la vidéo BG est absente) */
  #fallback{position:absolute;inset:-10%;z-index:0;
            background:radial-gradient(60% 70% at 30% 25%,rgba(40,120,170,.55),rgba(3,22,36,0) 70%),
                       radial-gradient(60% 70% at 75% 80%,rgba(30,90,160,.45),rgba(3,22,36,0) 70%);animation:drift 22s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translate(-3%,-2%) scale(1)}to{transform:translate(3%,2%) scale(1.12)}}
  #bgstage,#stage{position:absolute;inset:0}
  #bgstage{z-index:1} #stage{z-index:2;isolation:isolate}
  #bgstage video,#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;background:transparent}
  #bgstage video.on,#stage video.on{opacity:1}
  #beam{position:absolute;inset:0;z-index:3;width:100%;height:100%;mix-blend-mode:screen;opacity:0;pointer-events:none}
  /* interface projetée (PNG) : UI-Attente au repos, UI pendant la mission */
  .ui{position:absolute;inset:0;width:100%;height:100%;z-index:4;opacity:0;transition:opacity .45s ease;pointer-events:none}
  .ui.on{opacity:1}
  #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#9fd8e6;
         font:22px/1.6 system-ui,sans-serif;text-align:center;cursor:pointer;background:#02101a;z-index:99}
  #status{position:fixed;left:12px;bottom:10px;color:#3d6b78;font:12px system-ui,sans-serif;z-index:100;max-width:90vw}
</style></head><body>
<div id="frame">
  <div id="fallback"></div>
  <div id="bgstage"></div>
  <div id="stage"></div>
  <!-- Faisceau de lumière (coordonnées 1600 x 900) : désactivé par défaut, ajoutez ?beam=1 à l'adresse pour l'essayer -->
  <svg id="beam" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c8f0ff" stop-opacity=".30"/><stop offset=".6" stop-color="#c8f0ff" stop-opacity=".15"/><stop offset="1" stop-color="#c8f0ff" stop-opacity=".04"/>
      </linearGradient>
      <radialGradient id="pool"><stop offset="0" stop-color="#aee2ff" stop-opacity=".30"/><stop offset="1" stop-color="#aee2ff" stop-opacity="0"/></radialGradient>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="34"/></filter>
    </defs>
    <polygon points="350,-120 430,-120 900,640 150,640" fill="url(#cone)" filter="url(#soft)"/>
    <ellipse cx="760" cy="445" rx="600" ry="190" fill="url(#pool)"/>
  </svg>
  <img class="ui on" id="ui_attente" src="ui_attente.png" alt="">
  <img class="ui" id="ui" src="ui.png" alt="">
</div>
<div id="start"><div>Cliquez ici une fois, puis touche F pour le plein écran.<br>
<span id="relay" style="font-size:16px;color:#7fb">Connexion au relais…</span></div></div>
<div id="status"></div>
<script src="config.js"></script>
<script>
/* ====== À MODIFIER SI BESOIN ======
   Ordre d'affichage (de l'arrière vers l'avant) : fond BG (vidéo, en boucle du début à la fin) > créature (vidéos alpha) > UI (PNG)
   loop:true   -> la vidéo tourne en boucle sans à-coup jusqu'à la prochaine commande
   pre         -> durée (s) de l'amorce placée au début des fichiers de boucle (6 images) : sert à relayer le lecteur sans pause
   next:"..."  -> à la fin de la vidéo, on enchaîne sur celle-ci ('idle' = retour à l'écran d'attente)
   ui          -> au lancement de la vidéo, interface : 'scan' (celle de la vidéo Scan), 'ui' (UI.png), 'attente' (UI-Attente.png)
   beam        -> faisceau de lumière (seulement avec ?beam=1) */
const BG = { src: ['videos/bg.mp4', 'videos/bg.webm'], pre: 0 };   // fond : essaie bg.mp4 puis bg.webm
const CLIPS = {
  scan:       { src: 'videos/scan.webm',       ui: 'scan' },                       // reste sur sa dernière image jusqu'à « localise »
  start:      { src: 'videos/start.webm',      next: 'loop_fade', ui: 'ui' },
  loop_fade:  { src: 'videos/loop_fade.webm',  loop: true, pre: 0.2 },
  allumage:   { src: 'videos/allumage.webm',   next: 'loop_color', beam: 'flicker' },
  loop_color: { src: 'videos/loop_color.webm', loop: true, pre: 0.2, beam: 'on' },
  eat:        { src: 'videos/eat.webm',        next: 'loop_color', beam: 'on' },
  end:        { src: 'videos/end.webm',        next: 'idle', beam: 'fadeout' },
};
/* message reçu du téléphone -> vidéo à lancer   (attente / reset : retour à UI-Attente ;  localise : la vidéo Scan est remplacée par UI.png) */
const ACTIONS = { scan: 'scan', start: 'start', faisceau: 'allumage', eat: 'eat', end: 'end' };
const LEAD = 0.06;   // secondes : on lance la vidéo suivante juste avant la fin de la précédente (vidéos non bouclées)
/* =================================== */

const q = new URLSearchParams(location.search);
const RELAY = q.get('relay') || 'https://ntfy.sh';
const BEAM_ON = q.get('beam') === '1';
const st = document.getElementById('status'), rl = document.getElementById('relay');
const stage = document.getElementById('stage'), bgstage = document.getElementById('bgstage'), beam = document.getElementById('beam');
const uiA = document.getElementById('ui_attente'), uiB = document.getElementById('ui');

/* ---------- interface PNG ---------- */
function setUi(s) { uiA.classList.toggle('on', s === 'attente'); uiB.classList.toggle('on', s === 'ui'); }

/* ---------- vidéos ---------- */
function mkVideo(src, parent, label, onerr) {
  const v = document.createElement('video');
  v.src = src; v.preload = 'auto'; v.playsInline = true; v.muted = true; v.loop = false;
  v.addEventListener('error', () => onerr ? onerr(v) : failMsg(label, src, v));
  parent.appendChild(v); return v;
}
function failMsg(label, src, v) {
  st.textContent = 'Erreur vidéo ' + label + ' : ' + ((v.error && v.error.message) || '') + ' (' + src + ')';
  fetch(src, { method: 'HEAD', cache: 'no-store' }).then(r => { st.textContent += ' — réponse du site : ' + r.status + (r.status === 404 ? ' = fichier introuvable, voir diag.html' : ''); }).catch(() => {});
}
const ALL = [], els = {};
for (const [name, c] of Object.entries(CLIPS)) {
  els[name] = [];
  for (let i = 0; i < (c.loop ? 2 : 1); i++) {          // les boucles ont 2 lecteurs, utilisés en alternance
    const v = mkVideo(c.src, stage, name);
    v._t0 = (c.loop && i === 0) ? c.pre : 0;           // position de départ : on saute l'amorce à la première entrée dans une boucle
    v.addEventListener('ended', () => { if (v === curEl) advance(); });
    els[name].push(v); ALL.push(v);
  }
}
let ready = false, cur = null, curEl = null, idx = 0, queue = [], z = 1, advanced = false, pending = false;

/* ---------- fond BG : boucle permanente à deux lecteurs ---------- */
const bg = { els: [], idx: 0, pending: false, src: 0, ok: true };
function bgError(v) {
  if (v !== bg.els[0]) return;                           // une seule des deux vidéos décide
  if (bg.src + 1 < BG.src.length) { bg.src++; bg.els.forEach(e => { e.src = BG.src[bg.src]; e.load(); }); if (ready) bgStart(); }
  else { bg.ok = false; bg.els.forEach(e => e.remove()); bg.els = []; st.textContent = 'Fond BG introuvable (videos/bg.mp4) : fond de secours affiché'; }
}
for (let i = 0; i < 2; i++) { const v = mkVideo(BG.src[0], bgstage, 'bg', bgError); v._t0 = i === 0 ? BG.pre : 0; bg.els.push(v); }
function bgShow(el) { el.classList.add('on'); for (const o of bg.els) if (o !== el && o.classList.contains('on')) { o.classList.remove('on'); setTimeout(() => { if (!o.classList.contains('on')) { o.pause(); o.currentTime = 0; } }, 80); } }
function bgStart() { if (!bg.ok || !bg.els.length) return; const v = bg.els[0]; bg.idx = 0; bg.pending = false; v.currentTime = v._t0; v.play().catch(() => {}); whenFirstFrame(v, () => bgShow(v)); }
function bgTick() {
  if (!bg.ok || bg.els.length < 2) return;
  const a = bg.els[bg.idx], b = bg.els[1 - bg.idx]; if (!a.duration) return;
  const rem = a.duration - a.currentTime, pre = BG.pre;
  if (!bg.pending && rem <= pre + 0.04 && rem > 0.005) { bg.pending = true; if (b.currentTime > 0.01) b.currentTime = 0; b.play().catch(() => {}); }
  if (bg.pending && b.currentTime > 0.001 && b.currentTime + rem >= pre - 0.004) { bg.idx = 1 - bg.idx; bg.pending = false; bgShow(b); }
  if (a.ended && !bg.pending) { bg.pending = true; if (b.currentTime > 0.01) b.currentTime = 0; b.play().catch(() => {}); }   // secours
}

/* ---------- faisceau (désactivé par défaut) ---------- */
let beamAnim = null, beamState = 'off';
function setBeam(mode) {
  if (!BEAM_ON) return;
  if (mode === beamState || (mode === 'on' && (beamState === 'flicker' || beamState === 'on'))) return;
  if (beamAnim) { beamAnim.cancel(); beamAnim = null; }
  beamState = mode;
  if (mode === 'off') { beam.style.opacity = 0; return; }
  if (mode === 'fadeout') {
    const o = parseFloat(getComputedStyle(beam).opacity) || 0;
    beamAnim = beam.animate([{ opacity: o }, { opacity: 0 }], { duration: 500, fill: 'forwards' }); return;
  }
  const breathe = () => { beam.style.opacity = 1; beamAnim = beam.animate([{ opacity: 1 }, { opacity: .82 }, { opacity: 1 }], { duration: 1600, iterations: Infinity, easing: 'ease-in-out' }); };
  if (mode === 'on') return breathe();
  const hold = 'steps(1, end)';
  beamAnim = beam.animate([{ offset: 0, opacity: 0, easing: hold }, { offset: .25, opacity: .25, easing: hold }, { offset: .4167, opacity: 0, easing: hold },
    { offset: .6667, opacity: .65, easing: hold }, { offset: .8333, opacity: .2, easing: hold }, { offset: 1, opacity: 1 }], { duration: 500, fill: 'forwards' });
  beamAnim.onfinish = () => { beamAnim = null; beamState = 'off'; setBeam('on'); };
}

/* ---------- lecture de la créature ---------- */
function whenFirstFrame(el, cb) {
  const t0 = performance.now();
  (function poll() {
    if ((el.currentTime > 0.001 && el.readyState >= 2) || performance.now() - t0 > 600) cb();
    else requestAnimationFrame(poll);
  })();
}
function reveal(el) {            // vidéos alpha : l'ancienne disparaît dans la même image que l'arrivée de la nouvelle (pas de double exposition)
  el.style.zIndex = ++z; el.classList.add('on');
  for (const o of ALL) if (o !== el && o.classList.contains('on')) { o.classList.remove('on'); setTimeout(() => { if (!o.classList.contains('on')) { o.pause(); o.currentTime = 0; } }, 80); }
}
function rewind(v, t) { t = (t == null) ? v._t0 : t; if (Math.abs(v.currentTime - t) > 0.01) v.currentTime = t; }
function startClip(name) {
  const c = CLIPS[name]; stage.style.transition = 'none'; stage.style.opacity = 1;
  for (const o of ALL) if (!o.classList.contains('on') && !o.paused) o.pause();      // un lecteur de relais resté en route
  cur = name; idx = 0; curEl = els[name][0]; advanced = false; pending = false;
  rewind(curEl); curEl.play().catch(e => st.textContent = 'Lecture bloquée : ' + e.message);
  whenFirstFrame(curEl, () => reveal(curEl));
  if (c.ui) setUi(c.ui);
  setBeam(c.beam || 'off');
  if (c.loop) rewind(els[name][1], 0);                   // prépare le 2e lecteur (il démarre au tout début, amorce comprise)
  if (c.next && c.next !== 'idle') rewind(els[c.next][0]);   // prépare la vidéo suivante
  st.textContent = 'vidéo : ' + name;
}
function swapLoop() {                                      // secours : la boucle est arrivée au bout sans relais anticipé
  idx = 1 - idx; const other = els[cur][idx]; curEl = other; advanced = false; pending = false;
  rewind(other, CLIPS[cur].pre); other.play().catch(() => {});
  whenFirstFrame(other, () => reveal(other));
}
function advance() {
  if (advanced || !cur) return; advanced = true;
  const c = CLIPS[cur];
  if (c.loop) { if (queue.length) startClip(queue.shift()); else swapLoop(); return; }
  const n = queue.shift() || c.next;
  if (n === 'idle') idle(); else if (n) startClip(n);
}
/* Relais sans pause : les fichiers de boucle commencent par une amorce (les 6 dernières images de la boucle).
   Quand le lecteur A approche de la fin, le lecteur B démarre au début de son amorce ; dès que B montre la même image que A, on passe sur B. */
function tick() {
  if (ready && curEl && curEl.duration) {
    const c = CLIPS[cur], rem = curEl.duration - curEl.currentTime;
    if (c.loop && !queue.length) {
      const other = els[cur][1 - idx];
      if (!pending && rem <= c.pre + 0.04 && rem > 0.01) { pending = true; rewind(other, 0); other.play().catch(() => {}); }
      if (pending && other.currentTime > 0.001 && other.currentTime + rem >= c.pre - 0.004) {
        idx = 1 - idx; curEl = other; pending = false; advanced = false; reveal(other);
      }
    } else if (!c.loop && rem <= LEAD && (c.next || queue.length)) advance();
  }
  if (ready) bgTick();
  requestAnimationFrame(tick);
}
function fadeStage() {
  stage.style.transition = 'opacity .4s'; stage.style.opacity = 0;
  setTimeout(() => { if (!cur) for (const v of ALL) { v.classList.remove('on'); v.pause(); v.currentTime = v._t0; } }, 450);
}
function idle() {                                          // retour à l'attente : fond BG + UI-Attente
  queue = []; cur = null; curEl = null; setBeam('off'); setUi('attente'); fadeStage();
  st.textContent = 'en attente';
}
function localise() {                                      // spécimen localisé : la vidéo Scan est remplacée par UI.png
  queue = []; cur = null; curEl = null; setUi('ui'); fadeStage();
  st.textContent = 'spécimen localisé : UI';
}
function act(cmd) {
  if (!ready) { st.textContent = 'Pas encore activé : cliquez sur la page'; return; }
  if (cmd === 'reset' || cmd === 'attente') return idle();
  if (cmd === 'localise') return localise();
  const target = ACTIONS[cmd]; if (!target || target === cur) return;
  const oneShot = cur && !CLIPS[cur].loop && cur !== 'scan';
  if (oneShot) { if (queue[queue.length - 1] !== target) queue.push(target); } else startClip(target);   // une vidéo non bouclée en cours : on attend sa fin
}
document.getElementById('start').addEventListener('click', () => {
  document.getElementById('start').style.display = 'none'; ready = true;
  for (const v of ALL) { v.play().then(() => { v.pause(); v.currentTime = v._t0; }).catch(() => {}); }
  bgStart(); requestAnimationFrame(tick); idle();
});

const es = new EventSource(RELAY + '/' + window.TOPIC + '/sse');
es.onopen = () => { rl.textContent = '✓ Relais connecté, prêt.'; };
es.onerror = () => { rl.textContent = 'Relais injoignable : vérifiez internet'; };
es.onmessage = e => {
  let d; try { d = JSON.parse(e.data); } catch { return; }
  if (d.event && d.event !== 'message') return;
  const cmd = (d.message || '').trim(); st.textContent = 'message : ' + cmd; act(cmd);
};
/* Tests au clavier, sans téléphone : 1 attente, 2 scan, 3 localise, 4 start, 5 faisceau, 6 eat, 7 end, 0 remise à zéro, F plein écran */
addEventListener('keydown', e => {
  const k = { '1': 'attente', '2': 'scan', '3': 'localise', '4': 'start', '5': 'faisceau', '6': 'eat', '7': 'end', '0': 'reset' }[e.key]; if (k) act(k);
  if (e.key === 'f') document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
});
window.__dbg = () => ({ cur, queue: queue.join('>'), swap: pending, idx, beamState, ui: uiA.classList.contains('on') ? 'attente' : uiB.classList.contains('on') ? 'ui' : 'scan',
  on: ALL.filter(v => v.classList.contains('on')).map(v => v.src.split('/').pop()), bg: bg.ok ? bg.els.filter(v => v.classList.contains('on')).map(v => v.src.split('/').pop()) : 'secours' });
</script></body></html>
